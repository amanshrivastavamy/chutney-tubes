<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Leaf Green Background -->
  <rect width="1200" height="630" fill="#1d6b3a" />
  
  <!-- Subtle Chaat Stall Stamp Backdrop Pattern -->
  <circle cx="1000" cy="315" r="340" fill="#134a28" opacity="0.4" />
  <circle cx="1000" cy="315" r="280" stroke="#f2b81d" stroke-width="2" stroke-dasharray="10 8" opacity="0.4" />

  <!-- Left Content Column -->
  <g transform="translate(100, 120)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#f2b81d" />
    <text x="110" y="27" font-family="'Bricolage Grotesque', sans-serif" font-size="18" font-weight="900" fill="#18241b" text-anchor="middle" letter-spacing="1">CHUTNEY TUBES</text>

    <!-- Main Headline -->
    <text x="0" y="125" font-family="'Bricolage Grotesque', sans-serif" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Your favourite chutney,
    </text>
    <text x="0" y="195" font-family="'Bricolage Grotesque', sans-serif" font-size="60" font-weight="800" fill="#f2b81d" letter-spacing="-1">
      now in a tube.
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" font-family="'Hind', sans-serif" font-size="24" font-weight="500" fill="#f4f3ec">
      Hari, imli, schezwan, momo and more.
    </text>
    <text x="0" y="295" font-family="'Hind', sans-serif" font-size="24" font-weight="500" fill="#d8dcd4">
      No spoon, no sticky jar, no spill.
    </text>

    <!-- Trust Tag -->
    <rect x="0" y="340" width="460" height="46" rx="10" fill="#134a28" />
    <text x="230" y="370" font-family="'Hind', sans-serif" font-size="16" font-weight="600" fill="#f4f3ec" text-anchor="middle">
      12 Everyday Favourites · Delivered Across India · 100% Veg
    </text>
  </g>

  <!-- Right Visual: Three Fanned Tubes with Katori -->
  <g transform="translate(680, 110) scale(1.1)">
    <!-- Ground Shadow -->
    <ellipse cx="240" cy="380" rx="190" ry="20" fill="#134a28" opacity="0.6" />

    <!-- Left Tube: Imli -->
    <g transform="translate(130, 180) rotate(-20) translate(-40, -130)">
      <path d="M 12 36 L 78 36 C 78 140 76 190 72 202 C 68 214 60 220 45 220 C 30 220 22 214 18 202 C 14 190 12 140 12 36 Z" fill="#7a4a25" />
      <rect x="10" y="16" width="70" height="20" fill="#451a03" rx="2" />
      <circle cx="45" cy="74" r="16" fill="#f2b81d" />
      <text x="45" y="78" font-family="'Bricolage Grotesque', sans-serif" font-size="7" font-weight="900" fill="#18241b" text-anchor="middle">IMLI</text>
      <path d="M 28 220 L 62 220 L 60 238 C 60 242 56 244 45 244 C 34 244 30 242 30 238 Z" fill="#f2b81d" />
    </g>

    <!-- Right Tube: Schezwan -->
    <g transform="translate(350, 180) rotate(20) translate(-40, -130)">
      <path d="M 12 36 L 78 36 C 78 140 76 190 72 202 C 68 214 60 220 45 220 C 30 220 22 214 18 202 C 14 190 12 140 12 36 Z" fill="#c23a1a" />
      <rect x="10" y="16" width="70" height="20" fill="#7f1d1d" rx="2" />
      <circle cx="45" cy="74" r="16" fill="#f2b81d" />
      <text x="45" y="78" font-family="'Bricolage Grotesque', sans-serif" font-size="7" font-weight="900" fill="#18241b" text-anchor="middle">SCHEZWAN</text>
      <path d="M 28 220 L 62 220 L 60 238 C 60 242 56 244 45 244 C 34 244 30 242 30 238 Z" fill="#7f1d1d" />
    </g>

    <!-- Center Hero Tube: Hari -->
    <g transform="translate(240, 160) translate(-50, -145)">
      <path d="M 12 36 L 88 36 C 88 160 86 210 82 224 C 78 238 68 244 50 244 C 32 244 22 238 18 224 C 14 210 12 160 12 36 Z" fill="#2f8f46" />
      <rect x="10" y="16" width="80" height="20" fill="#14532d" rx="2" />
      <circle cx="50" cy="80" r="22" fill="#f2b81d" stroke="#ffffff" stroke-width="1.5" />
      <text x="50" y="77" font-family="'Bricolage Grotesque', sans-serif" font-size="8" font-weight="900" fill="#18241b" text-anchor="middle">CHUTNEY</text>
      <text x="50" y="87" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="900" fill="#c8361f" text-anchor="middle">TUBES</text>
      <text x="50" y="125" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">CHATPATI HARI</text>
      <path d="M 34 244 L 66 244 L 64 266 C 64 270 60 272 50 272 C 40 272 36 270 36 266 Z" fill="#f2b81d" />
    </g>
  </g>
</svg>
