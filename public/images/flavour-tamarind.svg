<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tamarindTube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="flvShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="320" height="320" rx="24" fill="#FEF3C7" fill-opacity="0.4"/>
  <circle cx="160" cy="160" r="110" fill="#FDE68A" fill-opacity="0.5"/>

  <!-- Tube -->
  <g transform="translate(115, 30)" filter="url(#flvShadow)">
    <!-- Crimp -->
    <rect x="10" y="20" width="70" height="18" rx="2" fill="#B45309" stroke="#451A03" stroke-width="1.5"/>
    <line x1="16" y1="26" x2="74" y2="26" stroke="#FEF3C7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Body -->
    <path d="M15 38 L15 190 C15 205 32 210 45 210 C58 210 75 205 75 190 L75 38 Z" fill="url(#tamarindTube)"/>
    <!-- Label -->
    <rect x="22" y="75" width="46" height="85" rx="6" fill="#FFFBEB"/>
    <text x="45" y="98" font-family="sans-serif" font-size="8" font-weight="900" fill="#78350F" text-anchor="middle">CHUTNEY</text>
    <text x="45" y="112" font-family="sans-serif" font-size="9" font-weight="bold" fill="#C2410C" text-anchor="middle">IMLI</text>
    <line x1="28" y1="118" x2="62" y2="118" stroke="#D97706" stroke-width="1"/>
    <text x="45" y="132" font-family="sans-serif" font-size="7" fill="#78350F" text-anchor="middle">Tamarind &amp;</text>
    <text x="45" y="142" font-family="sans-serif" font-size="7" fill="#78350F" text-anchor="middle">Jaggery</text>
    <!-- Cap -->
    <rect x="28" y="210" width="34" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="32" y="232" width="26" height="8" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Flavour badge -->
  <g transform="translate(160, 290)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#78350F"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FEF3C7" text-anchor="middle">
      TAMARIND (IMLI)
    </text>
  </g>
</svg>
