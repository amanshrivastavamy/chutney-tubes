<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFEDD5" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="tubeMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="tubeChilli" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="tubeTamarind" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="steelTiffin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1C1917" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background decorative disc -->
  <circle cx="300" cy="225" r="190" fill="url(#bgGrad)"/>
  <circle cx="300" cy="225" r="150" stroke="#FDE68A" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Tiffin Box (Stainless steel classic Indian lunchbox) -->
  <g filter="url(#softShadow)">
    <rect x="70" y="220" width="160" height="95" rx="14" fill="url(#steelTiffin)"/>
    <rect x="65" y="210" width="170" height="18" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="150" width="160" height="62" rx="12" fill="url(#steelTiffin)"/>
    <rect x="65" y="142" width="170" height="14" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Tiffin Latch clamp -->
    <path d="M60 160 L60 270 Q60 275 66 275 L70 275 L70 155 L66 155 Q60 155 60 160 Z" fill="#64748B"/>
    <path d="M230 160 L230 270 Q230 275 236 275 L240 275 L240 155 L236 155 Q230 155 230 160 Z" fill="#64748B"/>
    <!-- Handle -->
    <path d="M120 142 Q150 100 180 142" stroke="#64748B" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tamarind Tube (Left angle) -->
  <g transform="translate(230, 90) rotate(16)" filter="url(#softShadow)">
    <!-- Tube body -->
    <path d="M20 70 L20 230 C20 240 35 245 45 245 C55 245 70 240 70 230 L70 70 Z" fill="url(#tubeTamarind)"/>
    <!-- Crimp top -->
    <rect x="16" y="55" width="58" height="16" rx="2" fill="#B45309" stroke="#451A03" stroke-width="1"/>
    <line x1="22" y1="58" x2="68" y2="58" stroke="#FDE68A" stroke-width="1" stroke-dasharray="2 2"/>
    <!-- Label -->
    <rect x="25" y="105" width="40" height="75" rx="4" fill="#FFFBEB" opacity="0.95"/>
    <text x="45" y="125" font-family="sans-serif" font-size="8" font-weight="bold" fill="#78350F" text-anchor="middle">CHUTNEY</text>
    <text x="45" y="137" font-family="sans-serif" font-size="7" font-weight="bold" fill="#C2410C" text-anchor="middle">IMLI</text>
    <circle cx="45" cy="155" r="8" fill="#F59E0B" opacity="0.3"/>
    <text x="45" y="158" font-size="9" text-anchor="middle">✨</text>
    <!-- Flip cap -->
    <rect x="30" y="245" width="30" height="20" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="32" y="265" width="26" height="6" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Mint-Coriander Tube (Center Hero) -->
  <g transform="translate(320, 60) rotate(-6)" filter="url(#softShadow)">
    <!-- Tube body -->
    <path d="M20 60 L20 240 C20 252 38 258 50 258 C62 258 80 252 80 240 L80 60 Z" fill="url(#tubeMint)"/>
    <!-- Crimp top -->
    <rect x="15" y="44" width="70" height="18" rx="3" fill="#15803D" stroke="#14532D" stroke-width="1"/>
    <line x1="22" y1="48" x2="78" y2="48" stroke="#BBF7D0" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Label -->
    <rect x="26" y="100" width="48" height="90" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <text x="50" y="122" font-family="sans-serif" font-size="9" font-weight="900" fill="#14532D" text-anchor="middle">CHUTNEY</text>
    <text x="50" y="134" font-family="sans-serif" font-size="8" font-weight="bold" fill="#16A34A" text-anchor="middle">HARI MINT</text>
    <line x1="33" y1="140" x2="67" y2="140" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="50" y="156" font-family="sans-serif" font-size="7" fill="#4B5563" text-anchor="middle">MESS-FREE</text>
    <text x="50" y="170" font-family="sans-serif" font-size="7" font-weight="bold" fill="#047857" text-anchor="middle">150g • ZERO MESS</text>
    <!-- Flip cap -->
    <rect x="33" y="258" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="36" y="282" width="28" height="8" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Garlic-Chilli Tube (Right angle) -->
  <g transform="translate(425, 95) rotate(-22)" filter="url(#softShadow)">
    <!-- Tube body -->
    <path d="M20 70 L20 230 C20 240 35 245 45 245 C55 245 70 240 70 230 L70 70 Z" fill="url(#tubeChilli)"/>
    <!-- Crimp top -->
    <rect x="16" y="55" width="58" height="16" rx="2" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1"/>
    <!-- Label -->
    <rect x="25" y="105" width="40" height="75" rx="4" fill="#FFF1F2" opacity="0.95"/>
    <text x="45" y="125" font-family="sans-serif" font-size="8" font-weight="bold" fill="#991B1B" text-anchor="middle">CHUTNEY</text>
    <text x="45" y="137" font-family="sans-serif" font-size="7" font-weight="bold" fill="#DC2626" text-anchor="middle">GARLIC</text>
    <circle cx="45" cy="155" r="8" fill="#FCA5A5" opacity="0.3"/>
    <text x="45" y="159" font-size="9" text-anchor="middle">🌶️</text>
    <!-- Flip cap -->
    <rect x="30" y="245" width="30" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>

  <!-- Clean chutney squeeze swirl on plate / roti -->
  <g transform="translate(190, 310)">
    <ellipse cx="140" cy="70" rx="90" ry="32" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
    <ellipse cx="140" cy="68" rx="80" ry="26" fill="#FDE047" opacity="0.8"/> <!-- Paratha -->
    <!-- Chutney Swirl -->
    <path d="M100 65 Q130 52 160 62 Q180 68 170 75 Q150 82 120 76" stroke="#16A34A" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M110 65 Q135 55 155 63" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Badge banner -->
  <g transform="translate(300, 420)">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1C1917"/>
    <text x="0" y="4" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FEF3C7" text-anchor="middle">
      100% SQUEEZABLE • ZERO MESS • NO SPOON NEEDED
    </text>
  </g>
</svg>
