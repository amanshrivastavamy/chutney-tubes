<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <circle cx="100" cy="100" r="90" fill="#FFEDD5" fill-opacity="0.6"/>
  <!-- Snap shut tube & clean desk -->
  <g transform="translate(60, 45)">
    <!-- Tube lying clean -->
    <g transform="rotate(-15 40 40)">
      <rect x="25" y="10" width="30" height="8" rx="2" fill="#C2410C"/>
      <path d="M28 18 L28 65 C28 72 35 75 40 75 C45 75 52 72 52 65 L52 18 Z" fill="#EA580C"/>
      <!-- Cap closed -->
      <rect x="33" y="75" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    </g>
    <!-- Snap starburst -->
    <path d="M78 40 L84 46 M78 52 L84 46 M90 46 L84 46" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <text x="88" y="38" font-family="sans-serif" font-size="10" font-weight="900" fill="#D97706">SNAP!</text>
    <!-- Green checkmark for clean lunch -->
    <circle cx="45" cy="115" r="16" fill="#15803D"/>
    <path d="M39 115 L43 119 L51 110" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="155" cy="45" r="20" fill="#D97706"/>
  <text x="155" y="52" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
</svg>
