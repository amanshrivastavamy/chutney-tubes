<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <circle cx="100" cy="100" r="90" fill="#FEF3C7" fill-opacity="0.6"/>
  <!-- Tiffin Box Opening -->
  <g transform="translate(45, 55)">
    <rect x="10" y="45" width="90" height="50" rx="8" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
    <!-- Lid lifted up -->
    <g transform="translate(0, -15) rotate(-10)">
      <rect x="6" y="32" width="98" height="14" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
      <path d="M40 32 Q55 12 70 32" stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Food item inside -->
    <ellipse cx="55" cy="65" rx="32" ry="12" fill="#FDE047"/>
    <ellipse cx="55" cy="63" rx="28" ry="9" fill="#EAB308"/>
  </g>
  <circle cx="155" cy="45" r="20" fill="#C2410C"/>
  <text x="155" y="52" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
</svg>
