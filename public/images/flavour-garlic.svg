<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="garlicTube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <filter id="flvGShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#991B1B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="320" height="320" rx="24" fill="#FEE2E2" fill-opacity="0.5"/>
  <circle cx="160" cy="160" r="110" fill="#FECACA" fill-opacity="0.6"/>

  <!-- Tube -->
  <g transform="translate(115, 30)" filter="url(#flvGShadow)">
    <!-- Crimp -->
    <rect x="10" y="20" width="70" height="18" rx="2" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.5"/>
    <line x1="16" y1="26" x2="74" y2="26" stroke="#FEE2E2" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Body -->
    <path d="M15 38 L15 190 C15 205 32 210 45 210 C58 210 75 205 75 190 L75 38 Z" fill="url(#garlicTube)"/>
    <!-- Label -->
    <rect x="22" y="75" width="46" height="85" rx="6" fill="#FFF1F2"/>
    <text x="45" y="98" font-family="sans-serif" font-size="8" font-weight="900" fill="#991B1B" text-anchor="middle">CHUTNEY</text>
    <text x="45" y="112" font-family="sans-serif" font-size="9" font-weight="bold" fill="#DC2626" text-anchor="middle">GARLIC</text>
    <line x1="28" y1="118" x2="62" y2="118" stroke="#EF4444" stroke-width="1"/>
    <text x="45" y="132" font-family="sans-serif" font-size="7" fill="#991B1B" text-anchor="middle">Roasted Garlic</text>
    <text x="45" y="142" font-family="sans-serif" font-size="7" fill="#991B1B" text-anchor="middle">&amp; Red Chilli</text>
    <!-- Cap -->
    <rect x="28" y="210" width="34" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="32" y="232" width="26" height="8" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Flavour badge -->
  <g transform="translate(160, 290)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#991B1B"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FEE2E2" text-anchor="middle">
      GARLIC-CHILLI
    </text>
  </g>
</svg>
